[project]
name = "fastapi-mastery"
version = "0.1.0"
description = "Coding-first FastAPI mastery learning repository"
readme = "README.md"
requires-python = ">=3.11,<3.15"
dependencies = [
  "fastapi==0.141.1",
  "pydantic==2.13.4",
  "pydantic-settings==2.15.0",
  "uvicorn==0.52.4",
  "httpx==0.28.1",
  "python-multipart>=0.0.29,<1",
]

[dependency-groups]
dev = [
  "pytest==9.1.1",
  "pytest-cov==7.1.0",
  "pytest-asyncio>=1.3,<2",
  "hypothesis==6.165.10",
  "ruff==0.16.4",
  "mypy==2.3.1",
]
postgres = [
  "sqlalchemy==2.0.52",
  "alembic==1.19.1",
  "psycopg==3.3.4",
  "psycopg-binary==3.3.4",
  "psycopg-pool==3.3.0",
]
rabbitmq = [
  "aio-pika==10.0.1",
]
grpc = [
  "grpcio==1.83.1",
  "grpcio-tools==1.83.0",
  "protobuf==7.36.0",
]
redis = ["redis==8.1.0"]
observability = [
  "opentelemetry-api==1.44.0",
  "opentelemetry-sdk==1.44.0",
  "prometheus-client>=0.25,<1",
]

[tool.uv]
default-groups = ["dev"]

[tool.pytest.ini_options]
addopts = "-ra"
testpaths = ["units", "projects", "tests"]

[tool.coverage.run]
branch = true
source = ["units", "projects"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "RUF"]

[tool.mypy]
python_version = "3.11"
strict = true
warn_unreachable = true
show_error_codes = true
